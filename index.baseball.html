<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Solverline Dugout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dugout clipboard. Dark scoreboard header with a tab rail, one working column up to 1180px, scouting reports slide in from the right. */
:root{
  --bg:#edf1ef; --surface:#ffffff; --raise:#f6f9f7; --ink:#13201b; --muted:#56675f; --line:#d4ddd8;
  --accent:#17734a; --accent-ink:#ffffff; --accent-soft:#dbeee3;
  --bar:#13201b; --bar-ink:#e9f1ed; --bar-muted:#9fb3aa; --bar-line:#2a3a33;
  --stub:#855c00; --good:#17734a; --bad:#b2352e; --warn:#8f6400; --mid:#d19a10; --grass:#cfe5d3; --grass2:#c2dcc7; --dirt:#e6d2b5; --chalk:#ffffff;
  --r-diamond:#2668b8; --r-gold:#a5770a; --r-silver:#6f7d87; --r-bronze:#94592f; --r-common:#66746f; --r-red:#b8233a;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#15201c; --raise:#1a2722; --ink:#e4ede8; --muted:#93a59d; --line:#27362f;
  --accent:#4cc283; --accent-ink:#06150d; --accent-soft:#183326;
  --bar:#09100d; --bar-ink:#e4ede8; --bar-muted:#8aa096; --bar-line:#22312b;
  --stub:#e3b64a; --good:#4cc283; --bad:#ef6b60; --warn:#e3b64a; --mid:#d9a83a; --grass:#183427; --grass2:#1c3b2d; --dirt:#3f3123; --chalk:#c9d6cf;
  --r-diamond:#4c92e6; --r-gold:#c99a24; --r-silver:#8e9ca6; --r-bronze:#b87648; --r-common:#7c8a85; --r-red:#e0475c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#15201c; --raise:#1a2722; --ink:#e4ede8; --muted:#93a59d; --line:#27362f;
  --accent:#4cc283; --accent-ink:#06150d; --accent-soft:#183326;
  --bar:#09100d; --bar-ink:#e4ede8; --bar-muted:#8aa096; --bar-line:#22312b;
  --stub:#e3b64a; --good:#4cc283; --bad:#ef6b60; --warn:#e3b64a; --mid:#d9a83a; --grass:#183427; --grass2:#1c3b2d; --dirt:#3f3123; --chalk:#c9d6cf;
  --r-diamond:#4c92e6; --r-gold:#c99a24; --r-silver:#8e9ca6; --r-bronze:#b87648; --r-common:#7c8a85; --r-red:#e0475c;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:30px;text-transform:uppercase}
h3{font-size:21px;text-transform:uppercase}
p{margin:0}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line)}
.top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--font-display);font-size:30px;letter-spacing:.06em;line-height:1}
.brand span{font-size:12px;color:var(--bar-muted);letter-spacing:.08em;text-transform:uppercase}
.datachip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bar-line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--bar-ink);background:transparent;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.live{background:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.top .seg{border-color:var(--bar-line)}
.top .seg button{color:var(--bar-ink)}
.top .seg button[aria-pressed="true"]{color:var(--accent-ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:var(--bar-muted);text-decoration:none;font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px 10px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--accent)}
.tabs a .pro{font-family:var(--font-body);font-size:10px;letter-spacing:.06em;vertical-align:3px;margin-left:4px;color:var(--accent)}

main{padding-block:24px 64px}
section[data-view]{display:grid;gap:20px}
.head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap}
.head p{max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.notice{border:1px dashed var(--line);border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--raise)}
.notice p{flex:1 1 280px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.field{display:grid;gap:4px}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.field input[type=number]{width:120px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pro-pill{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px;vertical-align:2px}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--raise)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--raise)}
.pname{font-weight:600;white-space:nowrap}
.psub{font-size:12px;color:var(--muted);white-space:nowrap}
.rk{font-family:var(--font-display);font-size:22px;font-weight:700;width:44px}
.score{font-family:var(--font-mono);font-weight:500;font-size:16px}
.stub{font-family:var(--font-mono);color:var(--stub);white-space:nowrap}
.rar{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ovr{font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff;border-radius:5px;padding:0 6px;min-width:32px;text-align:center;line-height:24px;background:var(--r-common)}
.ovr.diamond{background:var(--r-diamond)}.ovr.gold{background:var(--r-gold)}.ovr.silver{background:var(--r-silver)}.ovr.bronze{background:var(--r-bronze)}.ovr.red{background:var(--r-red)}
.tag{display:inline-block;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:2px 8px;white-space:nowrap}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.lock{color:var(--muted);font-size:12px}

/* cards grid */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.up{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start}
.up .swap{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.up .gain{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--good);line-height:1}
.stat-row{display:flex;gap:24px;flex-wrap:wrap}
.stat .v{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.slot{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.slot:hover{border-color:var(--accent)}
.slot .pos{font-family:var(--font-display);font-weight:700;font-size:18px;width:38px;flex:none;color:var(--muted)}
.slot .who{flex:1;min-width:0}
.slot .who div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty .who{color:var(--muted);font-style:italic}
.lineup{list-style:none;margin:0;padding:0;display:grid;gap:0}
.lineup li{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.lineup li:last-child{border-bottom:0}
.lineup .n{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent);grid-row:span 2;line-height:1}
.lineup .why{grid-column:2/4;font-size:13px;color:var(--muted)}

/* report sheet */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);z-index:41;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:18px;align-content:start}
.sheet .x{position:sticky;top:0;justify-self:end;margin-bottom:-36px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;border-radius:4px;background:var(--raise);border:1px solid var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--muted)}
.bar .fill.hi{background:var(--good)}.bar .fill.lo{background:var(--bad)}
.rlist{margin:0;padding-left:18px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.kv div{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.kv b{display:block;font-family:var(--font-mono);font-size:15px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.form-grid .field input{width:100%}
textarea{width:100%;min-height:120px;font-family:var(--font-mono);font-size:12px}
pre.code{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
ol.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.locked{display:grid;gap:12px;justify-items:start;padding:28px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}
.slider{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center}
.slider input{width:100%;accent-color:var(--accent)}

/* card tiles + heat */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;cursor:pointer;align-content:start;min-width:0}
.tile:hover{border-color:var(--accent)}
.t-head{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.t-head .pname,.t-head .psub{overflow:hidden;text-overflow:ellipsis}
.face{--rc:var(--r-common);width:64px;height:86px;border-radius:8px;background:linear-gradient(160deg,var(--rc) 0%,color-mix(in oklab,var(--rc) 55%,#000) 100%);color:#fff;display:grid;grid-template-rows:auto auto 1fr;justify-items:center;align-items:start;padding:7px 4px 6px;box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--rc) 55%,#fff);position:relative;overflow:hidden}
.face::after{content:"";position:absolute;left:-30%;right:-30%;bottom:-62%;height:100%;border-radius:50%;border-top:1px dashed rgba(255,255,255,.35)}
.face b{font-family:var(--font-display);font-size:30px;line-height:1}
.face .fp{font-family:var(--font-display);font-size:14px;letter-spacing:.06em;line-height:1.2}
.face .ft{font-size:10px;letter-spacing:.1em;align-self:end;opacity:.9;font-weight:600}
.face.diamond{--rc:var(--r-diamond)}.face.gold{--rc:var(--r-gold)}.face.silver{--rc:var(--r-silver)}.face.bronze{--rc:var(--r-bronze)}.face.red{--rc:var(--r-red)}
.face.team{background:linear-gradient(165deg,var(--tc) 0%,var(--tc) 52%,color-mix(in oklab,var(--tc) 55%,#000) 100%);box-shadow:inset 0 0 0 3px var(--rc),inset 0 0 0 4px rgba(255,255,255,.25)}
.face.team::before{content:"";position:absolute;left:0;right:0;top:60%;height:7%;background:var(--tc2);opacity:.95}
.face .fs{position:relative;z-index:1}
.face .rb{position:absolute;top:4px;right:4px;font-family:var(--font-body);font-size:8px;font-weight:700;letter-spacing:.04em;background:var(--rc);color:#fff;border-radius:3px;padding:1px 3px;box-shadow:0 0 0 1px rgba(255,255,255,.5);z-index:2;line-height:1.3}
.face .fser{font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.9;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:end;position:relative;z-index:1}
.face.lg .rb{font-size:10px;top:6px;right:6px;padding:1px 5px}
.face.lg{grid-template-rows:auto auto 1fr auto}
.face.lg{width:112px;height:150px;border-radius:12px;padding-top:12px}
.face.lg b{font-size:54px}.face.lg .fp{font-size:22px}.face.lg .ft{font-size:12px}
.heat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.heat.full{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.hc{--h:var(--mid);background:color-mix(in oklab,var(--h) 18%,var(--surface));border-bottom:3px solid var(--h);border-radius:6px;padding:4px 7px 3px;display:grid;line-height:1.2;min-width:0}
.hc span{font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc b{font-family:var(--font-mono);font-size:15px;font-weight:500}
.hc i{font-style:normal;font-size:10px;color:var(--muted)}
.t-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.rankbadge{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--accent);margin-right:4px}
.legend{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend .g{width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bad),var(--mid),var(--good))}
.dd-head{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:start;padding-right:72px}
.fit{display:grid;gap:8px}
.fit-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.fit-row .pos{font-family:var(--font-display);font-weight:700;font-size:18px}
.fit-row .g{font-family:var(--font-mono);font-weight:500}
.fit-row .g.up{color:var(--good)}.fit-row .g.down{color:var(--bad)}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:10px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.cmpbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cmpbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg);flex:none}
.cmp-row{display:grid;grid-template-columns:1fr 96px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmp-row>:first-child{text-align:right}
.cmp-row .mid{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center;font-weight:600}
.cmp-row .v{font-family:var(--font-mono)}
.cmp-row .win{font-weight:700;color:var(--good)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.diamond-wrap{display:grid;gap:12px}
.diamond{position:relative;width:100%;max-width:640px;aspect-ratio:1/1;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.diamond svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dslot{position:absolute;transform:translate(-50%,-50%);width:clamp(72px,21%,128px);display:grid;justify-items:center;gap:1px;padding:5px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dslot:hover{border-color:var(--accent)}
.dslot .dp{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--accent);line-height:1}
.dslot .dn{font-weight:600;font-size:12px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dslot .ds{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.2;display:flex;gap:4px;align-items:center}
.dslot .ds .ovr{font-size:12px;line-height:16px;min-width:22px;padding:0 3px;border-radius:3px}
.dslot.empty{border-style:dashed;background:color-mix(in oklab,var(--surface) 80%,transparent)}
.dslot.empty .dn{color:var(--muted);font-weight:500}
@media (max-width:480px){.dslot{width:clamp(64px,23%,96px);padding:3px 2px}.dslot .dn{font-size:11px}}
.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.pool .pname-in{font-family:var(--font-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:2px 0;width:100%}
.plist{display:grid;gap:4px;max-height:280px;overflow-y:auto}
.pitem{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding:4px 6px;border-radius:6px;background:var(--raise)}
.pitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pitem.pick{background:var(--accent-soft);outline:1px solid var(--accent)}
.sres{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}

<script>
/* ===== Engine: pure functions, no DOM ===== */
const HIT_POS=['C','1B','2B','3B','SS','LF','CF','RF'];
const BOARD_POS=[...HIT_POS,'DH','SP','RP'];
const POS_NAME={C:'catchers','1B':'first basemen','2B':'second basemen','3B':'third basemen',SS:'shortstops',LF:'left fielders',CF:'center fielders',RF:'right fielders',DH:'DHs',SP:'starters',RP:'relievers'};
const SLOTS=['C','1B','2B','3B','SS','LF','CF','RF','DH','SP1','SP2','SP3','SP4','SP5','RP1','RP2','RP3','RP4','RP5','RP6'];
const slotPos=s=>s.startsWith('SP')?'SP':s.startsWith('RP')?'RP':s;
const isPitchPos=P=>P==='SP'||P==='RP';
const PRESETS={
  balanced:{label:'Balanced',con:30,pow:32,vis:18,dis:12,clu:8,def:100,spd:100},
  brewers:{label:'Brewers style',con:38,pow:16,vis:22,dis:16,clu:8,def:160,spd:150},
  meta:{label:'Power meta',con:28,pow:44,vis:14,dis:8,clu:6,def:60,spd:60}
};
// Which defensive attributes matter at each spot (weights sum to 1)
const DEFW={C:{fld:.3,arm:.2,acc:.15,rea:.1,blk:.25},'1B':{fld:.6,rea:.3,acc:.1},'2B':{fld:.4,rea:.3,arm:.1,acc:.2},'3B':{fld:.3,rea:.3,arm:.25,acc:.15},SS:{fld:.35,rea:.3,arm:.2,acc:.15},LF:{fld:.3,rea:.3,spd:.2,arm:.1,acc:.1},CF:{fld:.25,rea:.3,spd:.25,arm:.1,acc:.1},RF:{fld:.3,rea:.25,spd:.1,arm:.25,acc:.1}};
// How much defense counts at each spot, relative to offense = 1, at 100% defense importance
const POSDEF={C:.45,SS:.45,CF:.4,'2B':.35,'3B':.28,RF:.22,LF:.18,'1B':.12,DH:0};
const SPD_BASE=.12;
const PW={SP:{h9:.2,k9:.2,bb9:.12,hr9:.2,ctl:.07,vel:.05,mov:.06,sta:.06,pcl:.04},RP:{h9:.2,k9:.24,bb9:.12,hr9:.2,ctl:.08,vel:.06,mov:.05,pcl:.05}};
const RAW_H=['cl','cr','pl','pr','vis','dis','clu','fld','arm','acc','rea','blk','spd','bra','agg'];
const RAW_P=['h9','k9','bb9','hr9','vel','ctl','mov','sta','pcl'];
const NUM=['o','cl','cr','pl','pr','vis','dis','clu','fld','arm','acc','rea','blk','spd','bra','agg','sta','h9','k9','bb9','hr9','vel','ctl','mov','pcl','h9l','h9r','k9l','k9r','bs','bb'];

function normPos(p){p=String(p||'').toUpperCase().trim();return p==='CP'?'RP':p}
function mkCard(o){
  const c={id:String(o.id??o.n),n:String(o.n||'Unknown'),t:String(o.t||''),se:String(o.se||''),ra:String(o.ra||''),b:String(o.b||''),th:String(o.th||'')};
  for(const k of NUM)c[k]=Number(o[k])||0;
  c.p=normPos(o.p)||'DH';
  c.sec=String(o.s||'').split(/[,\/]/).map(normPos).filter(x=>x&&x!==c.p);
  c.s=c.sec.join(', ');
  c.h=!isPitchPos(c.p);
  if(o.custom)c.custom=true;
  return c;
}
const avg2=(a,b)=>(a+b)/2;
function offVs(c,hand,w){
  const con=hand==='R'?c.cr:c.cl, pow=hand==='R'?c.pr:c.pl;
  const t=w.con+w.pow+w.vis+w.dis+w.clu||1;
  return (w.con*con+w.pow*pow+w.vis*c.vis+w.dis*c.dis+w.clu*c.clu)/t;
}
const offAll=(c,w)=>.7*offVs(c,'R',w)+.3*offVs(c,'L',w);
function defAt(c,P){const W=DEFW[P];if(!W)return 0;let s=0;for(const k in W)s+=W[k]*c[k];return s}
const spdScore=c=>.55*c.spd+.3*c.bra+.15*c.agg;
function hitScore(c,P,w){
  const O=offAll(c,w);
  const wd=(POSDEF[P]||0)*w.def/100, ws=SPD_BASE*w.spd/100;
  const D=wd?defAt(c,P):0;
  return (O+D*wd+spdScore(c)*ws)/(1+wd+ws);
}
function pitchScore(c,P){const W=PW[P]||PW.RP;let s=0,t=0;for(const k in W){s+=W[k]*c[k];t+=W[k]}return s/t}
const scoreAt=(c,P,w)=>isPitchPos(P)?pitchScore(c,P):hitScore(c,P,w);
function eligible(c,P){
  if(P==='DH')return c.h;
  if(P==='SP')return c.p==='SP';
  if(P==='RP')return c.p==='RP'||c.p==='SP';
  return c.h&&(c.p===P||c.sec.includes(P));
}
const HM={con:c=>avg2(c.cl,c.cr),pow:c=>avg2(c.pl,c.pr),eye:c=>avg2(c.vis,c.dis),def:(c,P)=>P==='DH'?null:defAt(c,P),spd:spdScore};
const HM_LABEL={con:'contact',pow:'power',eye:'plate discipline',def:'defense',spd:'speed & stealing'};
const PM=['h9','k9','bb9','hr9','vel','ctl','mov','sta'];
const PM_LABEL={h9:'hit prevention',k9:'strikeouts',bb9:'walk prevention',hr9:'HR prevention',vel:'velocity',ctl:'command',mov:'movement',sta:'stamina'};

function buildModel(cards,w){
  const groups={};
  for(const c of cards){const P=c.p;(groups[P]||(groups[P]=[])).push(c);c.sc=scoreAt(c,P,w);c.ms=scoreAt(c,P,PRESETS.meta)}
  const pt={};
  for(const P in groups){
    const g=groups[P];
    [...g].sort((a,b)=>b.ms-a.ms).forEach((c,i)=>c.mrk=i+1);
    g.sort((a,b)=>b.sc-a.sc).forEach((c,i)=>c.rk=i+1);
    const t=pt[P]={};
    const keys=isPitchPos(P)?PM:Object.keys(HM);
    for(const m of keys){t[m]=g.map(c=>isPitchPos(P)?c[m]:HM[m](c,P)).filter(v=>v!=null).sort((a,b)=>a-b)}
    t.sc=g.map(c=>c.sc).sort((a,b)=>a-b);
    for(const k of (isPitchPos(P)?RAW_P:RAW_H))t['a:'+k]=g.map(c=>c[k]).filter(v=>v>0).sort((a,b)=>a-b);
  }
  [...cards].sort((a,b)=>b.sc-a.sc).forEach((c,i)=>c.ork=i+1);
  return {groups,pt};
}
function pct(model,P,m,v){
  const a=model.pt[P]&&model.pt[P][m];if(!a||!a.length||v==null)return .5;
  let lo=0,hi=a.length;while(lo<hi){const mid=(lo+hi)>>1;if(a[mid]<=v)lo=mid+1;else hi=mid}
  return lo/a.length;
}
function metricsFor(c,P,model){
  const keys=isPitchPos(P)?PM.filter(m=>m!=='sta'||P==='SP'):Object.keys(HM).filter(m=>!(m==='def'&&P==='DH'));
  return keys.map(m=>{const v=isPitchPos(P)?c[m]:HM[m](c,P);return {m,label:isPitchPos(P)?PM_LABEL[m]:HM_LABEL[m],v,p:pct(model,c.p===P?P:c.p,m,v)}});
}
function archetype(c,P,model){
  const M={};for(const x of metricsFor(c,P,model))M[x.m]=x.p;
  const sp=pct(model,c.p,'sc',c.sc);
  if(isPitchPos(P)){
    if(M.k9>=.8&&M.hr9>=.6)return 'Bat-misser';
    if(M.k9>=.8)return 'Strikeout artist';
    if(M.hr9>=.8&&M.h9>=.6)return 'Contact killer';
    if(M.bb9>=.8&&M.ctl>=.6)return 'Command artist';
    if(P==='SP'&&M.sta>=.85&&sp>=.5)return 'Workhorse';
    if(M.vel>=.85)return 'Flamethrower';
    if(M.h9<=.3&&M.hr9<=.3)return 'Hittable';
    return sp>=.6?'Solid arm':P==='SP'?'Back-end starter':'Middle relief';
  }
  const split=Math.abs(offVs(c,'R',PRESETS.balanced)-offVs(c,'L',PRESETS.balanced));
  const d=M.def??.5;
  if(M.con>=.75&&M.pow>=.75&&d>=.75&&M.spd>=.7)return 'Five-tool';
  if(M.con>=.75&&M.pow>=.75)return 'Complete hitter';
  if(d>=.8&&M.con<.4&&M.pow<.4)return 'Defensive specialist';
  if(d>=.7&&M.con>=.6&&M.pow<.55)return 'Glove-first contact bat';
  if(M.pow>=.75&&M.con<.5)return 'Three-true-outcomes slugger';
  if(M.pow>=.7&&d<.35&&P!=='DH')return 'Bat-only masher';
  if(M.spd>=.75&&d>=.65)return 'Speed & defense';
  if(M.spd>=.7&&(M.con>=.65||M.eye>=.7))return 'Table-setter';
  if(split>=10)return 'Platoon bat';
  return sp>=.6?'Solid regular':sp>=.3?'Role player':'Bench depth';
}
function topOf(n){return n<=0?1:n}
function report(c,model,w,cards){
  const P=c.p, pos=POS_NAME[P]||P;
  const mets=metricsFor(c,P,model);
  const strengths=mets.filter(x=>x.p>=.75).sort((a,b)=>b.p-a.p).slice(0,2).map(x=>`Top ${topOf(Math.round((1-x.p)*100))}% ${x.label} among ${pos} (${Math.round(x.v)})`);
  const weaknesses=mets.filter(x=>x.p<=.3).sort((a,b)=>a.p-b.p).slice(0,2).map(x=>`Bottom ${topOf(Math.round(x.p*100))}% ${x.label} among ${pos} (${Math.round(x.v)})`);
  const notes=[];
  if(c.h){
    const r=offVs(c,'R',w),l=offVs(c,'L',w);
    if(Math.abs(r-l)>=10)notes.push(r>l?`Platoon split: ${Math.round(r)} vs RHP, ${Math.round(l)} vs LHP. Sit him against lefties if you have a better option.`:`Reverse split: ${Math.round(l)} vs LHP, ${Math.round(r)} vs RHP. Most valuable against lefty starters.`);
    if(c.spd>=80)notes.push(`Real steal threat: speed ${c.spd}, stealing ${c.bra}. Green-light him on the bases.`);
    else if(c.spd&&c.spd<=45)notes.push(`Station-to-station runner (speed ${c.spd}). Don't send him on close plays.`);
    if(c.sec.length)notes.push(`Can also play ${c.sec.join(', ')}.`);
  }else{
    if(P==='SP'&&c.sta&&c.sta<60)notes.push(`Low stamina (${c.sta}). Expect him to tire by the 5th.`);
    if(c.h9l&&c.h9r&&Math.abs(c.h9r-c.h9l)>=15)notes.push(c.h9r>c.h9l?`Much tougher on righties (H/9 ${c.h9r} vs R, ${c.h9l} vs L). Keep him away from lefty-heavy lineups.`:`Much tougher on lefties (H/9 ${c.h9l} vs L, ${c.h9r} vs R). A weapon against left-handed bats.`);
  }
  let value=null;
  if(c.bs>0){
    const g=model.groups[P].filter(x=>x.bs>0);
    const best=g[0];
    if(best&&best.id!==c.id)value=`${Math.round(c.sc/best.sc*100)}% of the top ${P}'s score (${best.n}) for ${Math.max(1,Math.round(c.bs/best.bs*100))}% of the price.`;
    else if(best)value=`Best ${P} on the market by your weights.`;
  }else value='Not on the market right now (no listing price).';
  let meta=null;
  const diff=c.mrk-c.rk;
  if(Math.abs(diff)>=8){
    const M={};for(const x of mets)M[x.m]=x.p;
    let why;
    if(c.h){
      if(diff>0)why=(M.def??0)>=.65?'his glove counts for more in your weights':M.spd>=.65?'your weights value his speed':M.con>M.pow?'your weights favor contact over power':'his all-around game';
      else why=M.pow>=.65?`the meta loves his power (${Math.round(HM.pow(c))})`:(M.def??1)<=.4?`your weights punish his glove (${Math.round(defAt(c,P))})`:'the meta leans harder on raw power';
    }else why='pitchers use the same weights in both, so this is a tie-break effect';
    meta=`You rank him #${c.rk} at ${P}, the power meta ranks him #${c.mrk}: ${why}.`;
  }
  return {tag:archetype(c,P,model),strengths,weaknesses,notes,value,meta,mets};
}
function alternatives(c,model){
  const g=(model.groups[c.p]||[]).filter(x=>x.id!==c.id&&x.bs>0&&!x.custom&&x.sc>=c.sc-4);
  return (c.bs>0?g.filter(x=>x.bs<=c.bs*.6):g).sort((a,b)=>b.sc-a.sc).slice(0,3);
}
function teamFit(c,team,w){
  const rows=[];
  for(const s of SLOTS){
    const P=slotPos(s);if(!eligible(c,P))continue;
    const cur=team[s]||null;if(cur&&cur.id===c.id){rows.push({slot:s,P,cur,mine:true,v:scoreAt(c,P,w),gain:0,team:0});continue}
    const v=scoreAt(c,P,w),cv=cur?scoreAt(cur,P,w):0;
    rows.push({slot:s,P,cur,v,gain:v-cv,team:(v-cv)*slotWeight(s)});
  }
  // for pitchers keep only the weakest slot of each type (the one he would replace)
  const out=[];const seen={};
  for(const r of rows.sort((a,b)=>b.gain-a.gain)){const k=isPitchPos(r.P)?r.P:r.slot;if(seen[k])continue;seen[k]=1;out.push(r)}
  const best=out.find(r=>!r.mine)||null;
  let bat=null;
  if(best&&!isPitchPos(best.P)&&best.gain>0){
    const t2={...team,[best.slot]:c};
    const hs=[...HIT_POS,'DH'].map(s=>t2[s]).filter(Boolean);
    const spot=h=>{const L=buildLineup(hs,h,w);const x=L.find(y=>y.c.id===c.id);return x?x.spot:null};
    bat={R:spot('R'),L:spot('L')};
  }
  return {rows:out,best,bat};
}
/* Co-op draft: min-cost max-flow so every player brings exactly their quota and the combined team scores highest */
class Flow{
  constructor(n){this.n=n;this.g=Array.from({length:n},()=>[])}
  add(u,v,cap,cost){const e={v,cap,cost,rev:this.g[v].length};this.g[u].push(e);this.g[v].push({v:u,cap:0,cost:-cost,rev:this.g[u].length-1});return e}
  run(s,t){
    const n=this.n;
    for(;;){
      const dist=new Array(n).fill(Infinity),inq=new Array(n).fill(false),pv=new Array(n),pe=new Array(n);dist[s]=0;const q=[s];inq[s]=true;
      while(q.length){const u=q.shift();inq[u]=false;const g=this.g[u];for(let i=0;i<g.length;i++){const e=g[i];if(e.cap>0&&dist[u]+e.cost<dist[e.v]){dist[e.v]=dist[u]+e.cost;pv[e.v]=u;pe[e.v]=i;if(!inq[e.v]){inq[e.v]=true;q.push(e.v)}}}}
      if(dist[t]===Infinity)break;
      let f=Infinity;for(let v=t;v!==s;v=pv[v])f=Math.min(f,this.g[pv[v]][pe[v]].cap);
      for(let v=t;v!==s;v=pv[v]){const e=this.g[pv[v]][pe[v]];e.cap-=f;this.g[v][e.rev].cap+=f}
    }
  }
}
const COOP_HIT=['C','1B','2B','3B','SS','LF','CF','RF','DH'];
const COOP_PIT=['SP1','SP2','SP3','SP4','SP5','RP1','RP2','RP3','RP4','RP5','RP6'];
function coopPart(pools,quota,slots,w,hit){
  pools=pools.map(p=>p.filter(c=>hit?c.h:!c.h));
  const card={};pools.flat().forEach(c=>card[c.id]=c);
  const ids=Object.keys(card),np=pools.length;
  const N=2+np+ids.length*2+slots.length,s=0,t=N-1;
  const PN=i=>1+i,Gi=k=>1+np+2*k,Go=k=>Gi(k)+1,SN=j=>1+np+2*ids.length+j;
  const F=new Flow(N);
  pools.forEach((_,i)=>F.add(s,PN(i),quota,0));
  const pe=[];
  pools.forEach((pool,i)=>{const seen=new Set();for(const c of pool){if(seen.has(c.id))continue;seen.add(c.id);pe.push({i,id:c.id,e:F.add(PN(i),Gi(ids.indexOf(c.id)),1,0)})}});
  ids.forEach((id,k)=>F.add(Gi(k),Go(k),1,0));
  const se=[];
  ids.forEach((id,k)=>slots.forEach((sl,j)=>{const P=slotPos(sl);if(eligible(card[id],P))se.push({id,sl,e:F.add(Go(k),SN(j),1,-Math.round(scoreAt(card[id],P,w)*slotWeight(sl)*10000))})}));
  slots.forEach((_,j)=>F.add(SN(j),t,1,0));
  F.run(s,t);
  const slotOf={};se.filter(x=>x.e.cap===0).forEach(x=>slotOf[x.id]=x.sl);
  const byPlayer=pools.map(()=>[]);
  pe.filter(x=>x.e.cap===0).forEach(x=>byPlayer[x.i].push({c:card[x.id],slot:slotOf[x.id],P:slotPos(slotOf[x.id])}));
  byPlayer.forEach(a=>a.sort((x,y)=>slots.indexOf(x.slot)-slots.indexOf(y.slot)));
  const team={};byPlayer.flat().forEach(x=>team[x.slot]=x.c);
  return {byPlayer,team,short:byPlayer.map(a=>quota-a.length)};
}
function coopSolve(pools,hq,pq,w){
  const H=coopPart(pools,hq,COOP_HIT,w,true),Pi=coopPart(pools,pq,COOP_PIT,w,false);
  const team={...H.team,...Pi.team};
  const filled=Object.entries(team).map(([sl,c])=>scoreAt(c,slotPos(sl),w));
  const names={};let dupes=[];for(const c of Object.values(team)){if(names[c.n])dupes.push(c.n);names[c.n]=1}
  return {hit:H,pit:Pi,team,avg:filled.length?filled.reduce((a,b)=>a+b,0)/filled.length:0,dupes};

/* ---------- Top 100 ---------- */
function renderTop(){
  const T=state.top;

  $('#v-top').innerHTML=`
    <div class="head"><div><h2>Top 100 overall</h2><p class="muted">Every position on one board, ranked by your weights. Hitters are scored at their main position, so a great glove at short counts. Hitters and pitchers share the same ratings scale, so treat the mixed list as a guide and the split lists as the cleaner read.</p></div></div>

/* ---------- Compare ---------- */
function renderCmpBar(){
  const bar=$('#cmpbar');const ids=state.compare;
  if(!ids.length){bar.hidden=true;return}
  const a=byId(ids[0]);
  bar.innerHTML=`<span>Comparing <b>${esc(a?a.n:'card')}</b>. Open another card and tap Compare.</span><button class="btn small" type="button" data-act="cmp-clear">Cancel</button>`;
  bar.hidden=false;
}
function openCompare(a,b){
  const keys=a.h&&b.h?RAW_H:!a.h&&!b.h?RAW_P:[];
  const row=(lab,va,vb,fa,fb,hi=true)=>{const wa=hi?va>vb:va<vb,wb=hi?vb>va:vb<va;return `<div class="cmp-row"><span class="v ${wa?'win':''}">${fa}</span><span class="mid">${lab}</span><span class="v ${wb?'win':''}">${fb}</span></div>`};
  const fit=c=>{const f=teamFit(c,teamCards(),state.w);return f.best?f.best.gain:0};
  openSheet(`<div style="padding-right:72px"><span class="label">Head to head</span><h2>${esc(a.n)} vs ${esc(b.n)}</h2></div>
    <div class="cmp-row"><span>${faceHtml(a)}</span><span class="mid">${esc(a.p)} / ${esc(b.p)}</span><span>${faceHtml(b)}</span></div>
    ${row('Your score',a.sc,b.sc,a.sc.toFixed(1),b.sc.toFixed(1))}
    ${row('Pos rank',-a.rk,-b.rk,'#'+a.rk+' '+a.p,'#'+b.rk+' '+b.p)}
    ${row('Team gain',fit(a),fit(b),(fit(a)>0?'+':'')+fit(a).toFixed(1),(fit(b)>0?'+':'')+fit(b).toFixed(1))}
    ${row('Buy now',a.bs||Infinity,b.bs||Infinity,a.bs?fmt(a.bs):'—',b.bs?fmt(b.bs):'—',false)}
    ${keys.map(k=>row(STAT_LABEL[k],a[k],b[k],a[k]||'—',b[k]||'—')).join('')}

    <p class="small muted">Team gain is how much each one would add at his best slot on your current team.</p>`);
}

/* ---------- Co-op draft ---------- */
function seedCoopExample(){
  const R=mulberry(7);const hit=CARDS.filter(c=>c.h&&!c.custom),pit=CARDS.filter(c=>!c.h&&!c.custom);
  const take=(arr,k)=>{const a=[...arr];const out=[];while(out.length<k&&a.length)out.push(a.splice(Math.floor(R()*a.length),1)[0].id);return out};
  state.coop.players.forEach((p,i)=>{p.ids=[...take(hit,7),...take(pit,6)];p.name='Player '+(i+1)});
  state.coop.example=true;state.coop.seeded=true;
}

    <div class="panel"><h3>Staff</h3><div class="give">${COOP_PIT.filter(s=>res.team[s]).map(s=>`<div class="give-row"><span class="pos">${s}</span><span>${esc(res.team[s].n)} <span class="psub">${esc(players[pools.findIndex(pl=>pl.some(c=>c.id===res.team[s].id))]?.name||'')}</span></span><span class="num small">${scoreAt(res.team[s],slotPos(s),state.w).toFixed(1)}</span></div>`).join('')||'<p class="muted small">No pitchers picked yet.</p>'}</div></div></div>`:''}

      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-act="copy-snippet">Copy loader</button></div>
      <pre class="code" id="snipView"></pre>
      <label class="field"><span class="label">Paste card data</span><textarea id="paste" placeholder="Paste here after the console says Done"></textarea></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-act="load">Load cards</button>${live?'<button class="btn" type="button" data-act="example">Switch back to example cards</button>':''}</div>
      <p class="small muted">Next year, run the same loader on mlb27.theshow.com. Prices are a snapshot, so reload them when you're about to buy.</p>
    </div>`;
  $('#snipView').textContent=$('#snippet').textContent.trim();
}

/* ---------- routing / chrome ---------- */
function currentView(){const h=location.hash.slice(1);return VIEWS.includes(h)?h:'board'}
function render(){
  const v=currentView();
  for(const x of VIEWS)$('#v-'+x).hidden=x!==v;
  document.querySelectorAll('.tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+v?'page':'false'));
  $('#tierPro').setAttribute('aria-pressed',String(!isFree()));$('#tierFree').setAttribute('aria-pressed',String(isFree()));
  const live=DATA.source==='live';
  $('#dataDot').className='dot'+(live?' live':'');
  $('#dataLabel').textContent=live?`Live · ${fmt(DATA.cards.length)} cards`:'Example cards (made up)';
  renderCmpBar();
  ({coop:renderCoop,board:renderBoard,top:renderTop,team:renderTeam,lineup:renderLineup,moneyball:renderMoneyball,log:renderLog,weights:renderWeights,data:renderData})[v]();
}
function rescore(){rebuild();persist()}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr.click,.tile,.fit-row[data-card],[data-act]');if(!t)return;
  const d=t.dataset;
  if(d.act==='close'){closeSheet();return}
  if(d.act==='tier-pro'){state.tier='pro';persist();closeSheet();render();return}
  if(d.act==='more'){state.board.limit+=40;render();return}
  if(d.act==='topmore'){state.top.limit+=48;render();return}
  if(d.act==='cmp-clear'){state.compare=[];state.cmpPick=false;renderCmpBar();return}
  if(d.cmp){
    if(state.compare.length===1&&state.compare[0]!==d.cmp){const a=byId(state.compare[0]),b=byId(d.cmp);state.compare=[];state.cmpPick=false;renderCmpBar();if(a&&b)openCompare(a,b);return}
    state.compare=[d.cmp];state.cmpPick=true;closeSheet();renderCmpBar();toast('Now open the card to compare against');return}
  if(d.bmode){state.board.mode=d.bmode;render();return}
  if(d.act==='cp-reset'){state.coop.players.forEach(p=>p.ids=[]);state.coop.example=false;state.coop.seeded=true;persist();render();return}
  if(d.cpadd){const [i,id]=d.cpadd.split('|');const p=state.coop.players[+i];if(!p.ids.includes(id))p.ids.push(id);persist();render();const q=$('#cp-q-'+i);if(q)q.focus();return}
  if(d.cprm){const [i,id]=d.cprm.split('|');const p=state.coop.players[+i];p.ids=p.ids.filter(x=>x!==id);persist();render();return}
  if(d.cpteam){const p=state.coop.players[+d.cpteam];for(const id of Object.values(state.team))if(id&&!p.ids.includes(id))p.ids.push(id);persist();render();return}
  if(d.cpclear){state.coop.players[+d.cpclear].ids=[];persist();render();return}
  if(d.topk){state.top.kind=d.topk;state.top.limit=48;render();return}
  if(d.act==='copy-snippet'){const s=$('#snippet').textContent.trim();navigator.clipboard?.writeText(s).then(()=>toast('Loader copied')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#snipView'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Selected. Press Cmd/Ctrl+C')});return}
  if(d.act==='load'){
    const txt=$('#paste').value.trim();if(!txt){toast('Paste the card data first');return}
    try{
      const res=parseCards(txt);
      if(!res.cards.length)throw new Error('no cards');
      if(!res.healthy){toast('Loaded, but most ratings are blank. The feed fields may have changed.')}
      DATA={cards:res.cards,source:'live',game:res.game,at:res.at};
      if(!lsSet(LS_CARDS,txt))toast('Loaded. Too big to keep in this browser, so paste again next visit.');
      else toast(`Loaded ${fmt(res.cards.length)} cards`);
      state.team={};rescore();location.hash='#board';render();
    }catch(err){toast("That doesn't look like Dugout card data. Run the loader again and paste its output.")}
    return;
  }
  if(d.act==='example'){DATA={cards:exampleCards(),source:'example',game:'',at:0};try{localStorage.removeItem(LS_CARDS)}catch(e){}state.team=exampleTeam(DATA.cards);rescore();render();return}
  if(d.pos){state.board.pos=d.pos;state.board.limit=40;render();return}
  if(d.card){openReport(d.card);return}
  if(d.slot){openPicker(d.slot);return}
  if(d.pick){const [s,id]=d.pick.split('|');state.team[s]=id;persist();closeSheet();render();toast(byId(id).n+' set at '+s);return}
  if(d.clear){delete state.team[d.clear];persist();closeSheet();render();return}
  if(d.custom){openCustom(d.custom);return}
  if(d.apply){const [s,id]=d.apply.split('|');state.team[s]=id;persist();closeSheet();render();toast(byId(id).n+' set at '+s);return}
  if(d.uptab){state.upTab=d.uptab;persist();render();return}
  if(d.mb){state.mb=d.mb;render();return}
  if(d.preset){state.preset=d.preset;state.w={...PRESETS[d.preset]};rescore();render();return}
  if(d.del!=null){const i=Number(d.del);if(state.confirmDel===i){state.log.splice(i,1);state.confirmDel=null;persist()}else state.confirmDel=i;render();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.matches('tr.click,.tile,.fit-row[data-card]'))e.target.click();
});
$('#sheetBack').addEventListener('click',closeSheet);
$('#dataChip').addEventListener('click',()=>{location.hash='#data'});
$('#tierPro').addEventListener('click',()=>{state.tier='pro';persist();render()});
$('#tierFree').addEventListener('click',()=>{state.tier='free';persist();render()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.cpq!=null){coopSearch(+t.dataset.cpq);return}
  if(t.id==='bq'){state.board.q=t.value;state.board.limit=40;const pos=t.selectionStart;render();const n=$('#bq');n.focus();n.setSelectionRange(pos,pos)}
  else if(t.dataset.w){state.w[t.dataset.w]=Number(t.value);state.preset='custom';$('#wv-'+t.dataset.w).textContent=t.value+(t.dataset.w==='def'||t.dataset.w==='spd'?'%':'');document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed','false'));
    for(const P of ['C','SS','CF','2B','3B','RF','LF','1B','DH']){const wd=(POSDEF[P]||0)*state.w.def/100,ws=SPD_BASE*state.w.spd/100,tt=1+wd+ws;const el=$('#share-'+P);if(el)el.textContent=`${Math.round(wd/tt*100)}% / ${Math.round(ws/tt*100)}%`}
    clearTimeout(rescore.t);rescore.t=setTimeout(rescore,250)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bmax'){state.board.max=t.value;render()}
  else if(t.id==='tmax'){state.top.max=t.value;render()}
  else if(t.id==='cp-n'||t.id==='cp-hq'||t.id==='cp-pq'){state.coop[{'cp-n':'n','cp-hq':'hq','cp-pq':'pq'}[t.id]]=Number(t.value);persist();render()}
  else if(t.id.startsWith('cp-n-')){state.coop.players[+t.id.slice(5)].name=t.value.trim()||'Player '+(+t.id.slice(5)+1);persist();render()}
  else if(t.id==='budget'){state.budget=Number(t.value)||0;persist();render()}
  else if(t.id==='mbpos'){state.mbPos=t.value;render()}
  else if(t.id==='mbmax'){state.mbMax=t.value;render()}
  else if(t.id==='fmin'){state.flipMin=t.value;render()}
  else if(t.id==='fmax'){state.flipMax=t.value;render()}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='lform')return;
  e.preventDefault();
  const n=id=>{const v=$(id).value;return v===''?null:Number(v)};
  state.log.unshift({d:$('#lf-d').value,opp:$('#lf-opp').value.trim()||'—',style:$('#lf-s').value,rf:n('#lf-rf')||0,ra:n('#lf-ra')||0,h:n('#lf-h'),e:n('#lf-e')||0});
  persist();render();toast('Game logged');
});
window.addEventListener('hashchange',()=>{closeSheet();render();window.scrollTo(0,0)});

/* ---------- boot ---------- */
(function boot(){
  try{const s=lsGet(LS_STATE);if(s)applySaved(JSON.parse(s))}catch(e){}
  const cached=lsGet(LS_CARDS);
  if(cached){try{const r=parseCards(cached);DATA={cards:r.cards,source:'live',game:r.game,at:r.at}}catch(e){}}
  if(!DATA.cards.length){DATA={cards:exampleCards(),source:'example',game:'',at:0};if(!Object.keys(state.team).length)state.team=exampleTeam(DATA.cards)}
  rebuild();render();
  // Saved team, weights and game log follow the signed-in viewer across devices
  (async()=>{
    try{
      if(!window.claude||!window.claude.use)return;
      const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
      if(!user||!db)return;
      const id=await user.id();if(!id)return;
      dbRef=db.doc(`data/users/${id}/state/main`);
      const timer=new Promise(r=>setTimeout(()=>r(null),10000));
      const snap=await Promise.race([dbRef.get(),timer]);
      if(snap&&snap.exists){const d=snap.data();if(d&&d.json){const b=JSON.parse(d.json);const team=state.team;applySaved(b);if(DATA.source==='example'&&b.dataSource==='live')state.team=team;rebuild();render()}}
    }catch(e){dbRef=null}
  })();
})();
</script>
